controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Route de login JWT
api_login_check:
  path: /api/login
  methods: ['POST']

# Routes pour les trajets
api_trajets_search:
  path: /api/trajets/search
  controller: App\Controller\TrajetController::search
  methods: ['GET']

api_trajets_conducteur:
  path: /api/trajets/conducteur
  controller: App\Controller\TrajetController::getMesTrajets
  methods: ['GET']

api_trajets_create:
  path: /api/trajets
  controller: App\Controller\TrajetController::create
  methods: ['POST']

api_trajets_show:
  path: /api/trajets/{id}
  controller: App\Controller\TrajetController::show
  methods: ['GET']

api_trajets_update:
  path: /api/trajets/{id}
  controller: App\Controller\TrajetController::update
  methods: ['PUT']

api_trajets_annuler:
  path: /api/trajets/{id}/annuler
  controller: App\Controller\TrajetController::annuler
  methods: ['POST']


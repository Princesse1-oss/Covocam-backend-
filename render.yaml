services:
  - type: web
    name: covocam-backend
    runtime: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: covocam-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: JWT_PASSPHRASE
        generateValue: true
      - key: PAYMENT_MODE
        value: simulation
      - key: PLATFORM_COMMISSION_RATE
        value: "0.10"
      - key: MAILER_DSN
        value: smtp://andriadongmo@gmail.com:fvmnkbwttzkjzjzy@smtp.gmail.com:465?encryption=ssl&auth_mode=login
      - key: MAILER_SENDER_EMAIL
        value: andriadongmo@gmail.com
      - key: FRONTEND_URL
        value: https://covocam-frontend.vercel.app
      - key: CAMPAY_APP_CODE
        sync: false
      - key: CAMPAY_APP_PASSWORD
        sync: false
      - key: CORS_ALLOW_ORIGIN
        sync: false
    healthCheckPath: /api/login
    autoDeploy: true

databases:
  - name: covocam-db
    plan: free
    databaseName: covocam_db
